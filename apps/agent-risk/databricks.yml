bundle:
  name: agent_openai_agents_sdk

variables:
  llm_endpoint:
    description: "Existing Model Serving endpoint for the agent"
    default: "databricks-gpt-oss-120b"

resources:
  apps:
    agent_openai_agents_sdk:
      name: "agent-openai-agents-sdk"
      description: "OpenAI Agents SDK agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: DATABRICKS_MODEL_ENDPOINT
            value_from: "llm-endpoint"
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: ""
            permission: 'CAN_MANAGE'

        # NOTE: grants the app's service principal CAN_QUERY on the LLM endpoint so
        # the deployed app (and UI-created apps via manifest.yaml) can call the model
        # without a manual grant. The env var above uses this same resource so
        # the selected model and its permission cannot drift apart.
        - name: 'llm-endpoint'
          serving_endpoint:
            name: '${var.llm_endpoint}'
            permission: 'CAN_QUERY'

        # Confirmed trace table from the supplied agent-risk error log.
        # For a From Git deployment, add this resource in App Settings instead.
        - name: 'trace-spans'
          uc_securable:
            securable_full_name: 'workspace.ifc_case_comp.665854304075459_otel_spans'
            securable_type: 'TABLE'
            permission: 'MODIFY'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_openai_agents_sdk:
          name: agent-openai-agents-sdk
