bundle:
  name: agent_openai_agents_sdk

variables:
  genie_space_id:
    description: "The existing IFC Genie Space that owns all responses"
    default: "01f1ddf25d881906b7234f566362469b"

resources:
  apps:
    agent_openai_agents_sdk:
      name: "agent-openai-agents-sdk"
      description: "IFC workspace using the existing Genie Space"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: IFC_GENIE_SPACE_ID
            value_from: "ifc-genie"
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: ""
            permission: 'CAN_MANAGE'

        - name: 'ifc-genie'
          genie_space:
            name: 'IFC existing Genie Space'
            space_id: '${var.genie_space_id}'
            permission: 'CAN_RUN'

        # Confirmed trace table from the supplied agent-risk error log.
        # For a From Git deployment, add this resource in App Settings instead.
        - name: 'trace-spans'
          uc_securable:
            securable_full_name: 'workspace.ifc_case_comp.665854304075459_otel_spans'
            securable_type: 'TABLE'
            permission: 'MODIFY'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_openai_agents_sdk:
          name: agent-openai-agents-sdk
